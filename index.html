<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta name="color-scheme" content="light dark" />
    <script>
      ;(function () {
        var p = 'atmos',
          t,
          c
        try {
          t = JSON.parse(localStorage.getItem(p + '-theme'))
        } catch (e) {}
        try {
          c = JSON.parse(localStorage.getItem(p + '-contrast'))
        } catch (e) {}
        var r = document.documentElement
        r.dataset.theme =
          t === 'light' || t === 'dark'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        r.dataset.contrast =
          c === 'standard' || c === 'more'
            ? c
            : matchMedia('(prefers-contrast: more)').matches
              ? 'more'
              : 'standard'
        r.style.colorScheme = r.dataset.theme
      })()
      document.querySelector('meta[name="theme-color"]').content =
        document.documentElement.dataset.theme === 'dark'
          ? '#121b17'
          : '#f6f7f2'
    </script>
    <meta
      name="description"
      content="Weather, thoughtfully. A minimalist weather app with hourly forecasts, saved places, and offline access."
    />
    <title>Atmos — Weather, thoughtfully.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
