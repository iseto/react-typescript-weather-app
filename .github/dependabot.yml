version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    # typescript-eslint currently requires TypeScript <6.1; revisit with parser support.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      framework:
        patterns:
          - react
          - react-dom
      development-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
